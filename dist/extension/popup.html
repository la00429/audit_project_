<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AuditTest Vision</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 360px;
      min-height: 440px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1117;
      color: #e4e4e7;
      padding: 16px;
    }
    .header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid #27272a; }
    .header h1 { font-size: 15px; font-weight: 600; color: #fff; }
    .header .badge { background: #7c3aed; color: #fff; font-size: 9px; padding: 2px 6px; border-radius: 4px; }
    #start-audit-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #7c3aed, #a78bfa); color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity .2s; }
    #start-audit-btn:hover { opacity: .9; }
    #start-audit-btn:disabled { opacity: .5; cursor: not-allowed; }
    .status { margin-top: 10px; padding: 8px 12px; background: #1c1c22; border-radius: 6px; font-size: 11px; color: #a1a1aa; display: none; }
    .status.active { display: block; }
    .results { margin-top: 14px; display: none; }
    .results.active { display: block; }
    .score-section { text-align: center; margin-bottom: 14px; }
    .score-section #score-value { font-size: 2.4rem; font-weight: 800; }
    .score-section #score-label { font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; margin-top: 2px; }
    .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .summary-card { background: #1c1c22; border-radius: 8px; padding: 8px; text-align: center; }
    .summary-card .count { font-size: 18px; font-weight: 700; }
    .summary-card .label { font-size: 9px; color: #71717a; text-transform: uppercase; }
    .count.critical { color: #ef4444; }
    .count.major { color: #f59e0b; }
    .count.minor { color: #3b82f6; }
    .issue-list { max-height: 200px; overflow-y: auto; }
    .issue-item { background: #1c1c22; border-radius: 6px; padding: 9px 11px; margin-bottom: 6px; border-left: 3px solid #71717a; }
    .issue-item.critical { border-left-color: #ef4444; }
    .issue-item.major { border-left-color: #f59e0b; }
    .issue-item.minor { border-left-color: #3b82f6; }
    .issue-item .title { font-size: 11px; font-weight: 600; margin-bottom: 3px; }
    .issue-item .desc { font-size: 10px; color: #a1a1aa; line-height: 1.4; }
    .issue-item .fix-line { margin-top: 5px; font-size: 10px; color: #4ade80; background: #0f2d1a; padding: 4px 8px; border-radius: 4px; }
    .actions { margin-top: 10px; display: flex; gap: 6px; }
    .actions button { flex: 1; padding: 7px; border: 1px solid #3f3f46; background: transparent; color: #e4e4e7; border-radius: 6px; font-size: 10px; cursor: pointer; transition: background .2s; }
    .actions button:hover { background: #27272a; }
  </style>
</head>
<body>
  <div class="header">
    <h1>AuditTest Vision</h1>
    <span class="badge">OFFLINE</span>
  </div>

  <button id="start-audit-btn">Start Audit</button>
  <div id="status" class="status"></div>

  <div id="results" class="results">
    <div class="score-section">
      <div id="score-value">—</div>
      <div id="score-label">Score</div>
    </div>

    <div class="summary">
      <div class="summary-card">
        <div id="critical-count" class="count critical">0</div>
        <div class="label">Critical</div>
      </div>
      <div class="summary-card">
        <div id="major-count" class="count major">0</div>
        <div class="label">Major</div>
      </div>
      <div class="summary-card">
        <div id="minor-count" class="count minor">0</div>
        <div class="label">Minor</div>
      </div>
    </div>

    <div id="issue-list" class="issue-list"></div>

    <div class="actions">
      <button id="export-github-btn">Export GitHub Issue</button>
      <button id="copy-fixes-btn">Copy All Fixes</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
