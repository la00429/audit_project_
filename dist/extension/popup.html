<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AuditTest Vision</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      width: 380px;
      min-height: 480px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1117;
      color: #e4e4e7;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #27272a;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
    }

    .header .badge {
      background: #6366f1;
      color: #fff;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 500;
    }

    #start-audit-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    #start-audit-btn:hover { opacity: 0.9; }
    #start-audit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .status {
      margin-top: 12px;
      padding: 8px 12px;
      background: #1c1c22;
      border-radius: 6px;
      font-size: 12px;
      color: #a1a1aa;
      display: none;
    }

    .status.active { display: block; }

    .results {
      margin-top: 16px;
      display: none;
    }

    .results.active { display: block; }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .summary-card {
      background: #1c1c22;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }

    .summary-card .count {
      font-size: 20px;
      font-weight: 700;
    }

    .summary-card .label {
      font-size: 10px;
      color: #71717a;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .count.critical { color: #ef4444; }
    .count.major { color: #f59e0b; }
    .count.minor { color: #3b82f6; }

    .issue-list {
      max-height: 260px;
      overflow-y: auto;
    }

    .issue-item {
      background: #1c1c22;
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 8px;
      border-left: 3px solid #71717a;
    }

    .issue-item.critical { border-left-color: #ef4444; }
    .issue-item.major { border-left-color: #f59e0b; }
    .issue-item.minor { border-left-color: #3b82f6; }

    .issue-item .title {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .issue-item .desc {
      font-size: 11px;
      color: #a1a1aa;
      line-height: 1.4;
    }

    .issue-item .fix-btn {
      margin-top: 6px;
      padding: 4px 8px;
      background: #22c55e;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 10px;
      cursor: pointer;
      font-weight: 500;
    }

    .actions {
      margin-top: 12px;
      display: flex;
      gap: 8px;
    }

    .actions button {
      flex: 1;
      padding: 8px;
      border: 1px solid #3f3f46;
      background: transparent;
      color: #e4e4e7;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .actions button:hover { background: #27272a; }
  </style>
</head>
<body>
  <div class="header">
    <h1>AuditTest Vision</h1>
    <span class="badge">AI</span>
  </div>

  <button id="start-audit-btn">Start Audit</button>

  <div id="status" class="status"></div>

  <div id="results" class="results">
    <div class="summary">
      <div class="summary-card">
        <div id="critical-count" class="count critical">0</div>
        <div class="label">Critical</div>
      </div>
      <div class="summary-card">
        <div id="major-count" class="count major">0</div>
        <div class="label">Major</div>
      </div>
      <div class="summary-card">
        <div id="minor-count" class="count minor">0</div>
        <div class="label">Minor</div>
      </div>
    </div>

    <div id="issue-list" class="issue-list"></div>

    <div class="actions">
      <button id="export-github-btn">Export as GitHub Issue</button>
      <button id="copy-fixes-btn">Copy All Fixes</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
